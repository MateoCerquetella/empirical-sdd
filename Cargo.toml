[package]
name = "empirical-sdd"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Portable, evidence-backed Spec-Driven Development protocol, library, and CLI"
repository = "https://github.com/MateoCerquetella/empirical-sdd"
readme = "README.md"
keywords = ["sdd", "ai", "workflow", "testing", "agents"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["ai/**"]

[lib]
name = "empirical_sdd"
path = "src/lib.rs"

[[bin]]
name = "empirical"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
hex = "0.4"
ignore = "=0.4.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "=0.3.36", features = ["formatting", "macros", "parsing"] }
toml = "0.8"
ulid = { version = "1", features = ["serde"] }
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"
