# empirical-sdd:managed-file
description = "Start or resume Empirical and continue in the current agent until a terminal state."
prompt = """
Run the request attached to this command through the repository's Empirical workflow. If there is no new request, resume the active feature.

Use the current Gemini agent. For genuinely vague work, retrieve repository and living-spec context with empirical_explore or empirical explore "<problem>", then conduct the original five Socratic passes in the current conversation: problem/user, observable outcome, boundaries/non-goals, failure/risk, and verification. Ask one question at a time, add only a material follow-up, show the complete refined contract, and wait for explicit human approval before starting Fast or Complex. Do not merely repeat the packet's generic questions. For concrete work, choose Fast only for explicit, tiny, localized, reversible, low-risk non-UI changes and Complex otherwise. Start with empirical_fast or empirical_complex; fall back to empirical fast "<request>" or empirical complex "<request>". Resume active work with empirical_loop or empirical loop. Preserve workstream identity, complete exact revisions with evidence, archive after Review, and consume every response directly. Never select legacy Quick for new work, add profile/JSON controls, or launch another AI runtime.

Command reference:
- Socratic discovery: `empirical explore "<idea>"`
- Socratic discovery, then launch Codex: `empirical explore "<idea>" --agent codex`
- Direct tiny change: `empirical fast "<request>"`
- Direct substantial or UI change: `empirical complex "<request>"`
- Unrelated active work: `empirical workstream create <name>`, then add `--workstream <name>`
- Resume active work: `empirical loop [--workstream <name>]`

The `--agent codex` form is a human terminal entrypoint. Agents must continue in
their current runtime and use the MCP equivalents when available.
"""
